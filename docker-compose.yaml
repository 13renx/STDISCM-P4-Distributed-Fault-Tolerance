services:
  db:
    image: mongo:7
    ports:
      - "27018:27017"

  main:
    build:
      context: .
      dockerfile: main.Dockerfile
    depends_on:
      - db
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://db:27017/
      - SESSION_SECRET=secretkey

  login:
    build:
      context: .
      dockerfile: login.Dockerfile
    depends_on:
      - db
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGODB_URI=mongodb://db:27017/
      - SESSION_SECRET=secretkey