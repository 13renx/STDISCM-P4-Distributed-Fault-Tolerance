services:
  db:
    image: mongo:7
    ports:
      - "27018:27017"

  main:
    build:
      context: .
      dockerfile: main.Dockerfile
    depends_on:
      - db
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://db:27017/
      - SESSION_SECRET=secretkey
      - LOGIN_URL=http://localhost:5001
    develop:
      watch:
        - action: sync
          path: ./controllers/
          target: /app/controllers/
          #ignore: [ "node_modules/" ]
        - action: sync
          path: ./public/
          target: /app/public/
        - action: sync
          path: ./schemas/
          target: /app/schemas/
        - action: sync
          path: ./server/
          target: /app/server/
        - action: sync
          path: ./views/
          target: /app/views/
        - action: sync
          path: ./index.js
          target: /app/index.js
        - action: rebuild
          path: ./package.json
          target: /app/package.json
        - action: rebuild
          path: ./main.Dockerfile
          target: /app/main.Dockerfile
      
  login:
    build:
      context: .
      dockerfile: login.Dockerfile
    depends_on:
      - db
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGODB_URI=mongodb://db:27017/
      - SESSION_SECRET=secretkey
      - MAIN_URL=http://localhost:5000
    develop:
      watch:
        - action: sync
          path: ./controllers/
          target: /app/controllers/
        - action: sync
          path: ./public/
          target: /app/public/
        - action: sync
          path: ./schemas/
          target: /app/schemas/
        - action: sync
          path: ./server/
          target: /app/server/
        - action: sync
          path: ./views/
          target: /app/views/
        - action: sync
          path: ./login.js
          target: /app/login.js
        - action: rebuild
          path: ./package.json
          target: /app/package.json
        - action: rebuild
          path: ./login.Dockerfile
          target: /app/login.Dockerfile